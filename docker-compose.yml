version: '3.8'

services:
  db:
    image: postgres:13-alpine # Используем более легковесный образ
    env_file:
      - ./.env
    volumes:
    - pg_data:/var/lib/postgresql/data/
  
  backend:
    build: ./backend
    env_file:
      - ./.env
    volumes:
      - static:/app/static/
      - media:/app/media/
    depends_on:
      - db

  frontend:
    build: ./frontend
    volumes:
      - static:/app/build/static/ # Если фронтенд генерирует статику
  
  gateway:
    build: ./nginx
    volumes:
      - static:/var/html/static/
      - media:/var/html/media/
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend # Nginx зависит от обоих, чтобы проксировать запросы

volumes:
  pg_data:
  static:
  media: