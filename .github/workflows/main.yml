name: Kittygram CI/CD

on:
  push:
    branches:
      - main # Запуск при пуше в ветку main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # Используем последнюю версию Ubuntu для выполнения джоба

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Клонируем репозиторий

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Укажите версию Python, которую используете

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt # Устанавливаем зависимости для линтера и тестов

      - name: Run Ruff linter for backend
        run: |
          pip install ruff
          ruff check backend/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Укажите версию Node.js, которую использует фронтенд

      - name: Install frontend dependencies
        run: npm install
        working-directory: ./frontend

      - name: Run frontend tests
        run: npm test -- --watchAll=false # Запускаем тесты фронтенда
        working-directory: ./frontend

      - name: Create .env file
        run: |
          echo "DB_ENGINE=${{ secrets.DB_ENGINE }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env

      # Для запуска тестов бэкенда с базой данных, лучше использовать Docker Compose
      - name: Build and run Docker Compose for backend tests
        run: |
          docker compose -f docker-compose.yml up -d db backend
          sleep 10 # Даем время базе данных запуститься
          docker compose exec backend python manage.py migrate --noinput
          docker compose exec backend python manage.py test
        env:
          # Передаем переменные окружения для тестов, если они нужны
          DB_NAME: test_kittygram_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_HOST: db
          DB_PORT: 5432
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY_TEST }} # Используйте секрет для тестового ключа

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }} # Ваш логин Docker Hub
          password: ${{ secrets.DOCKER_PASSWORD }} # Ваш токен/пароль Docker Hub

      - name: Build and push backend image
        run: |
          docker build -t majestro17/kittygram_backend:latest ./backend
          docker push majestro17/kittygram_backend:latest

      - name: Build and push frontend image
        run: |
          docker build -t majestro17/kittygram_frontend:latest ./frontend
          docker push majestro17/kittygram_frontend:latest

      - name: Build and push gateway image
        run: |
          docker build -t majestro17/kittygram_gateway:latest ./nginx
          docker push majestro17/kittygram_gateway:latest

      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }} # ID чата или пользователя Telegram
          token: ${{ secrets.TELEGRAM_TOKEN }} # Токен вашего Telegram-бота
          message: |
            ✅ Kittygram CI/CD успешно завершен!
            Репозиторий: ${{ github.repository }}
            Коммит: ${{ github.sha }}
            Автор: ${{ github.actor }}
            Проект: Kittygram
